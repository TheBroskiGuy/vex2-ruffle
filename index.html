<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Vex 2</title>

    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        #game {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
    </style>
</head>

<body>

<div id="game"></div>

<script>
    window.RufflePlayer = window.RufflePlayer || {};

    window.addEventListener("load", function() {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();

        player.style.width = "100%";
        player.style.height = "100%";

        document.getElementById("game").appendChild(player);

        player.load(
            "https://www.addictinggames.com/sites/default/files/flash_games/vex2_0.swf"
        );
    });
</script>

</body>
</html>
